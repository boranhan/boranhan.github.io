<script>
(async()=>{
const err=document.getElementById('err'),go=document.getElementById('go'),f=document.getElementById('f');
const P=JSON.parse(document.getElementById('payload').textContent);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='notes-key';
// storage may be unavailable (private tabs, in-app browsers, blocked cookies): never let that break unlocking
const store={get(){try{return localStorage.getItem(KEY);}catch(e){return null;}},set(v){try{localStorage.setItem(KEY,v);}catch(e){}},del(){try{localStorage.removeItem(KEY);}catch(e){}}};
if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot decrypt (no WebCrypto). Open the link in Safari/Chrome directly, not inside another app.';go.disabled=true;return;}
async function decryptWith(rawKey){const k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.nonce)},k,b(P.ct));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(P.salt),iterations:P.iter},base,256));}
const saved=store.get();
if(saved){try{const html=await decryptWith(b(saved));show(html);return;}catch(e){store.del();}}
f.onsubmit=async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Deriving key… (a few seconds on phones)';
 let raw;try{raw=await derive(document.getElementById('pw').value);}catch(e){err.textContent='Key derivation failed: '+e;go.disabled=false;go.textContent='Unlock';return;}
 let html;try{html=await decryptWith(raw);}catch(e){err.textContent='Wrong passphrase.';go.disabled=false;go.textContent='Unlock';return;}
 if(document.getElementById('rem').checked)store.set(btoa(String.fromCharCode(...raw)));
 show(html);};
})().catch(e=>{const el=document.getElementById('err');if(el)el.textContent='Unlock script error: '+e;});
</script></body></html>
