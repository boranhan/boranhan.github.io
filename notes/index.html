<script>
(async()=>{
const P=JSON.parse(document.getElementById('payload').textContent);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='notes-key';
async function decryptWith(rawKey){const k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.nonce)},k,b(P.ct));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(P.salt),iterations:P.iter},base,256));}
const saved=localStorage.getItem(KEY);
if(saved){try{show(await decryptWith(b(saved)));return;}catch(e){localStorage.removeItem(KEY);}}
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.onsubmit=async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Deriving key…';
 try{const raw=await derive(document.getElementById('pw').value);const html=await decryptWith(raw);
  if(document.getElementById('rem').checked)localStorage.setItem(KEY,btoa(String.fromCharCode(...raw)));show(html);}
 catch(e){err.textContent='Wrong passphrase.';go.disabled=false;go.textContent='Unlock';}};
})();
</script></body></html>
