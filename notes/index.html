<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f7f8;color:#17181c}
@media(prefers-color-scheme:dark){body{background:#0e1013;color:#e8eaee}.card{background:#161a20 !important;border-color:#262b33 !important}input{background:#0e1013 !important;color:#e8eaee !important;border-color:#262b33 !important}}
.card{width:min(420px,92vw);background:#fff;border:1px solid #e6e7eb;border-radius:16px;padding:28px;box-shadow:0 8px 24px -12px rgba(16,24,40,.18)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffd500,#ff7000 55%,#e10500);display:grid;place-items:center;color:#fff;font-weight:900;margin-bottom:12px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 16px;color:#7b8190;font-size:13.5px}
input[type=password]{width:100%;box-sizing:border-box;height:44px;padding:0 12px;border-radius:10px;border:1px solid #e6e7eb;font-size:16px;outline:none}
input:focus{border-color:#f26b1d;box-shadow:0 0 0 4px #ffd8c2}
label.rem{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:#4b4f58}
button{width:100%;height:44px;border:0;border-radius:10px;background:#f26b1d;color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.6}
.err{color:#dc2626;font-size:13px;min-height:18px;margin-top:10px}
</style></head><body>

<input id="pw" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>
<label class="rem"><input type="checkbox" id="rem" checked> Remember on this device</label>
<button id="go">Unlock</button><div class="err" id="err"></div></form>

<script>
(async()=>{
const err=document.getElementById('err'),go=document.getElementById('go'),f=document.getElementById('f');
const P=JSON.parse(document.getElementById('payload').textContent);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='notes-key';
// storage may be unavailable (private tabs, in-app browsers, blocked cookies): never let that break unlocking
const store={get(){try{return localStorage.getItem(KEY);}catch(e){return null;}},set(v){try{localStorage.setItem(KEY,v);}catch(e){}},del(){try{localStorage.removeItem(KEY);}catch(e){}}};
if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot decrypt (no WebCrypto). Open the link in Safari/Chrome directly, not inside another app.';go.disabled=true;return;}
async function decryptWith(rawKey){const k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.nonce)},k,b(P.ct));return new TextDecoder().decode(pt);}
function show(html){document.open();document.write(html);document.close();}
async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
 return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b(P.salt),iterations:P.iter},base,256));}
const saved=store.get();
if(saved){try{const html=await decryptWith(b(saved));show(html);return;}catch(e){store.del();}}
f.onsubmit=async e=>{e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Deriving key… (a few seconds on phones)';
 let raw;try{raw=await derive(document.getElementById('pw').value);}catch(e){err.textContent='Key derivation failed: '+e;go.disabled=false;go.textContent='Unlock';return;}
 let html;try{html=await decryptWith(raw);}catch(e){err.textContent='Wrong passphrase.';go.disabled=false;go.textContent='Unlock';return;}
 if(document.getElementById('rem').checked)store.set(btoa(String.fromCharCode(...raw)));
 show(html);};
})().catch(e=>{const el=document.getElementById('err');if(el)el.textContent='Unlock script error: '+e;});
</script></body></html>
