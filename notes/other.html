<script>
(async()=>{
const err=document.getElementById('err'),go=document.getElementById('go'),f=document.getElementById('f');
const P=JSON.parse(document.getElementById('payload').textContent);
const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEY='notes-key-2';
const store={get(){try{return localStorage.getItem(KEY);}catch(e){return null;}},set(v){try{localStorage.setItem(KEY,v);}catch(e){}},del(){try{localStorage.removeItem(KEY);}catch(e){}}};
if(!(window.crypto&&crypto.subtle)){err.textContent='This browser cannot decrypt (no WebCrypto). Open the link in Safari/Chrome directly.';go.disabled=true;return;}
async function decryptWith(rawKey){const k=await crypto.subtle.importKey('raw',rawKey,'AES-GCM',false,['decrypt']);
